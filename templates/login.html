{% extends "base.html" %}
{% block title %}Secure Login{% endblock %}
{% block content %}

<div class="center">
  <form method="post" class="card form-card login-card">
    <div class="login-icon">🛡️</div>
    <span class="badge">PROTECTED ACCESS</span>
    <h1>Secure Login</h1>
    <p class="muted">
      Sign in to your CyberShield account. Repeated failed attempts
      are recorded and can trigger temporary lockout.
    </p>

    <label>Username</label>
    <input name="username" autocomplete="username" required>

    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password" required>

    <button class="btn" type="submit">Login Securely</button>

    <div class="demo">
      New here? <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </form>
</div>

{% endblock %}
